<header class="bju-header" id="header">
    <nav class="bju-nav-container">
        <!-- Logo de la marca -->
        <a href="/" class="logo">Box Jeans Urban</a>
        
        <!-- Menú de navegación -->
        <ul class="bju-nav-menu" id="nav-menu">
            <li><a href="#home" class="bju-nav-link">Inicio</a></li>
            <li><a href="#jeans" class="bju-nav-link">Jeans</a></li>
            <li><a href="#sudaderas" class="bju-nav-link">Sudaderas</a></li>
            <li><a href="#contacto" class="bju-nav-link">Contacto</a></li>
        </ul>
        
        <!-- Acciones del usuario -->
        <div class="bju-nav-actions">
            <div class="cart-wrapper" id="cartWrapper">
                <button class="bju-cart-btn" id="cartBtn">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="cart-badge" id="cartBadge">{{cantidad_items}}</span>
                </button>

                <!-- Mini carrito popup -->
                <div class="mini-cart" id="miniCart">
                    <div class="mini-cart-header">
                        <span>Mi Carrito</span>
                        <label class="select-all-label">
                            <input type="checkbox" id="selectAll"> Seleccionar todo
                        </label>
                    </div>

                    <div class="mini-cart-items" id="miniCartItems">
                        <p class="cart-empty">Cargando...</p>
                    </div>

                    <div class="mini-cart-footer">
                        <div class="mini-cart-total">
                            <span>Total:</span>
                            <span class="total-price" id="miniCartTotal">$0</span>
                        </div>
                        <button class="ver-carrito-btn" onclick="window.location.href='/carrito/'">
                            VER CARRITO (<span id="miniCartCount">0</span>)
                        </button>
                    </div>
                </div>
            </div>
